name: define-package-matrix

on:
  workflow_call:
    outputs:
      matrix:
        description: Package build matrix derived from flake package outputs.
        value: ${{ jobs.define-package-matrix.outputs.matrix }}

permissions:
  contents: read

jobs:
  define-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Define package matrix
        id: set-matrix
        run: |
          matrix="$(nix eval --json --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              qemuUnsupportedPackages = {
                # joplin-cli runs a target-architecture Yarn/Node install step
                # that currently traps with SIGILL under GitHub's x86_64 Linux
                # QEMU setup.
                aarch64-linux = ["joplin-terminal"];
              };
              isSupported = system: name:
                !(builtins.elem name (qemuUnsupportedPackages.${system} or []));
              mkEntries = system: os:
                builtins.map (name: {
                  inherit name os system;
                }) (builtins.filter (isSupported system) (builtins.attrNames flake.packages.${system}));
            in {
              include =
                mkEntries "x86_64-linux" "ubuntu-latest"
                ++ mkEntries "aarch64-linux" "ubuntu-latest"
                ++ mkEntries "aarch64-darwin" "macos-latest";
            }
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
