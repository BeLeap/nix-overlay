name: define-package-matrix

on:
  workflow_call:
    outputs:
      matrix:
        description: Package build matrix derived from flake package outputs.
        value: ${{ jobs.define-package-matrix.outputs.matrix }}

permissions:
  contents: read

jobs:
  define-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Define package matrix
        id: set-matrix
        run: |
          matrix="$(nix eval --json --impure --file scripts/define-package-matrix.nix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
