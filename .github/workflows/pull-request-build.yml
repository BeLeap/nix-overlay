name: pull-request-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  define-package-matrix:
    uses: ./.github/workflows/define-package-matrix.yml

  build-packages:
    needs: define-package-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-package-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.name }} (${{ matrix.system }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: ${{ matrix.system == 'aarch64-linux' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            ${{ matrix.system == 'aarch64-linux' && 'extra-platforms = aarch64-linux' || '' }}
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or last accessed this duration (ISO 8601 duration format)
          # before the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: P1DT12H
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Show Nix platforms
        run: nix config show | grep -E '^(system|extra-platforms) ='

      - name: Build package
        run: |
          nix_options=(--accept-flake-config)
          if [[ "${{ matrix.system }}" == "aarch64-linux" ]]; then
            nix_options+=(--option extra-platforms aarch64-linux)
          fi

          nix build --print-build-logs "${nix_options[@]}" .#packages.${{ matrix.system }}.${{ matrix.name }}
  success:
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - run: echo "success"
